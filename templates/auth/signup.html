{% extends 'memo/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card shadow">
            <div class="card-header bg-white">
                <h2 class="h5 mb-0">ユーザー登録</h2>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success w-100">登録</button>
                </form>
                <p class="text-center mt-3">
                    <a href="{% url 'login' %}">ログインはこちら</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
