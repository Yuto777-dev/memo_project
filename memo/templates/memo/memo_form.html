{% extends 'memo/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6"> <div class="card shadow">
            <div class="card-header bg-white">
                <h2 class="h5 mb-0 py-1">新しいメモを書く</h2>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        {{ form.as_p }}
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success">投稿する</button>
                        <a href="{% url 'index' %}" class="btn btn-outline-secondary">戻る</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
