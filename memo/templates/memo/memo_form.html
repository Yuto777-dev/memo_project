{% extends 'memo/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-white">
                <h2 class="h5 mb-0">新しいメモを書く</h2>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">タイトル</label>
                        {{ form.title }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">本文</label>
                        {{ form.content }}
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success">投稿する</button>
                        <a href="{% url 'index' %}" class="btn btn-outline-secondary">戻る</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
